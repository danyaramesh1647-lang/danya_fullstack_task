
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- CSS -->

    <style>

        * {
            box-sizing: border-box;
        }


        /* ---------- BODY ---------- */

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Trebuchet MS", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #ffffff 0%, transparent 30%),
                linear-gradient(135deg, #eee5ff, #d8c2f3, #f7efff);

            overflow-x: hidden;

            padding: 50px 15px;
        }


        /* ---------- FLOATING HEARTS ---------- */

        .hearts span {
            position: fixed;

            bottom: -50px;

            color: rgba(155, 108, 194, 0.45);

            font-size: 22px;

            animation: floatHeart linear infinite;

            z-index: 0;

            pointer-events: none;
        }


        .hearts span:nth-child(1) {
            left: 5%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .hearts span:nth-child(2) {
            left: 15%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        .hearts span:nth-child(3) {
            left: 28%;
            animation-duration: 10s;
            animation-delay: 0s;
        }

        .hearts span:nth-child(4) {
            left: 42%;
            animation-duration: 14s;
            animation-delay: 4s;
        }

        .hearts span:nth-child(5) {
            left: 55%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .hearts span:nth-child(6) {
            left: 68%;
            animation-duration: 13s;
            animation-delay: 5s;
        }

        .hearts span:nth-child(7) {
            left: 80%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .hearts span:nth-child(8) {
            left: 92%;
            animation-duration: 15s;
            animation-delay: 3s;
        }


        @keyframes floatHeart {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            50% {
                transform: translateY(-50vh) rotate(15deg);
            }

            100% {
                transform: translateY(-115vh) rotate(-15deg);
                opacity: 0;
            }

        }


        /* ---------- SPARKLES ---------- */

        .sparkles span {
            position: fixed;

            color: #ffffff;

            font-size: 18px;

            animation: sparkle 2s infinite alternate;

            z-index: 0;

            pointer-events: none;
        }


        .sparkles span:nth-child(1) {
            top: 12%;
            left: 8%;
            animation-delay: 0s;
        }

        .sparkles span:nth-child(2) {
            top: 25%;
            right: 8%;
            animation-delay: 0.7s;
        }

        .sparkles span:nth-child(3) {
            top: 60%;
            left: 5%;
            animation-delay: 1.2s;
        }

        .sparkles span:nth-child(4) {
            top: 75%;
            right: 7%;
            animation-delay: 0.4s;
        }

        .sparkles span:nth-child(5) {
            top: 45%;
            right: 3%;
            animation-delay: 1.5s;
        }


        @keyframes sparkle {

            from {
                opacity: 0.2;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }

        }


        /* ---------- MAIN CARD ---------- */

        .main-card {

            position: relative;

            z-index: 2;

            max-width: 850px;

            margin: auto;

            padding: 42px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.82);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 25px 60px rgba(105, 70, 140, 0.20);

        }


        /* ---------- HEADING ---------- */

        .title {

            text-align: center;

            color: #76529b;

            font-size: 36px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .title-heart {
            display: inline-block;

            animation: heartBeat 1.5s infinite;
        }


        @keyframes heartBeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

        }


        .subtitle {

            text-align: center;

            color: #9b87b5;

            margin-bottom: 35px;

            font-size: 15px;

        }


        /* ---------- SECTION TITLE ---------- */

        .section-title {

            color: #76529b;

            font-size: 19px;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 20px;

            padding-bottom: 9px;

            border-bottom: 2px dashed #dccbf0;

        }


        /* ---------- LABELS ---------- */

        label {

            color: #6d5790;

            font-weight: bold;

            margin-bottom: 7px;

        }


        /* ---------- INPUTS ---------- */

        .form-control,
        .form-select {

            border: 1.5px solid #d8c5ed;

            border-radius: 13px;

            padding: 11px 14px;

            background: rgba(252, 249, 255, 0.9);

            color: #665579;

            transition: 0.3s;

        }


        .form-control::placeholder {

            color: #b3a5c2;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #a47bc9;

            box-shadow:
                0 0 0 4px rgba(164, 123, 201, 0.12);

            background-color: white;

        }


        /* ---------- GENDER ---------- */

        .gender-box {

            background: #f8f2ff;

            border: 1px solid #e2d3f2;

            border-radius: 13px;

            padding: 12px 15px;

            color: #6d5790;

        }


        .gender-box input {

            accent-color: #9b70c5;

            margin-right: 5px;

        }


        .gender-box label {

            font-weight: normal;

            margin-right: 22px;

            color: #6d5790;

        }


        textarea {

            resize: none;

        }


        /* ---------- BUTTON AREA ---------- */

        .button-area {

            text-align: center;

            margin-top: 30px;

        }


        /* REGISTER BUTTON */

        .register-btn {

            border: none;

            color: white;

            padding: 12px 34px;

            border-radius: 14px;

            font-weight: bold;

            background:
                linear-gradient(135deg, #a77acb, #8060aa);

            box-shadow:
                0 7px 18px rgba(128, 96, 170, 0.28);

            transition: 0.3s;

        }


        .register-btn:hover {

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(128, 96, 170, 0.38);

        }


        /* CLEAR FORM */

        .clear-btn {

            border: 1px solid #d8c5ed;

            color: #76529b;

            padding: 12px 30px;

            border-radius: 14px;

            font-weight: bold;

            background: #f7f0ff;

            margin-left: 8px;

            transition: 0.3s;

        }


        .clear-btn:hover {

            background: #eadcf8;

            color: #644486;

            transform: translateY(-3px);

        }


        /* ---------- MESSAGE ---------- */

        .alert {

            border-radius: 14px;

            text-align: center;

            border: none;

        }


        /* ---------- STUDENT SECTION ---------- */

        .student-section {

            margin-top: 50px;

        }


        .student-title {

            text-align: center;

            color: #76529b;

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        /* ---------- TABLE ---------- */

        .table-container {

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid #dfd0f0;

            box-shadow:
                0 8px 20px rgba(120, 80, 160, 0.08);

        }


        .table {

            margin-bottom: 0;

        }


        .table thead th {

            background:
                linear-gradient(135deg, #a77acb, #8662ad);

            color: white;

            padding: 14px;

            border: none;

        }


        .table tbody td {

            padding: 13px;

            color: #665579;

            background: #fdfaff;

            vertical-align: middle;

        }


        .table tbody tr:hover td {

            background: #f5edff;

        }


        /* ---------- CLEAR DATA ---------- */

        .clear-data-btn {

            display: block;

            margin: 22px auto 0;

            border: none;

            background: #eee2fa;

            color: #76529b;

            padding: 11px 25px;

            border-radius: 13px;

            font-weight: bold;

            transition: 0.3s;

        }


        .clear-data-btn:hover {

            background: #dcc8ef;

            color: #5f407f;

            transform: translateY(-2px);

        }


        /* ---------- MOBILE ---------- */

        @media (max-width: 576px) {

            body {
                padding: 25px 10px;
            }


            .main-card {
                padding: 25px 18px;
            }


            .title {
                font-size: 28px;
            }


            .clear-btn {
                margin-left: 0;
                margin-top: 10px;
            }


            .gender-box label {
                display: block;
                margin-bottom: 5px;
            }

        }

    </style>

</head>


<body>


<!-- FLOATING HEARTS -->

<div class="hearts">

    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>

</div>


<!-- SPARKLES -->

<div class="sparkles">

    <span>✦</span>
    <span>✧</span>
    <span>✦</span>
    <span>✧</span>
    <span>✦</span>

</div>



<div class="container">

    <div class="main-card">


        <!-- TITLE -->

        <h1 class="title">

            🎓 Student Registration
            <span class="title-heart">♡</span>

        </h1>


        <p class="subtitle">

            ✨ Create your student profile with love ✨

        </p>



        <!-- FORM -->

        <form id="registrationForm">


            <!-- PERSONAL DETAILS -->

            <div class="section-title">

                💜 Personal Details

            </div>


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label>First Name</label>

                    <input type="text"
                           id="firstName"
                           class="form-control"
                           placeholder="Enter first name">

                </div>


                <div class="col-md-6 mb-3">

                    <label>Last Name</label>

                    <input type="text"
                           id="lastName"
                           class="form-control"
                           placeholder="Enter last name">

                </div>


            </div>



            <!-- DOB -->

            <div class="mb-3">

                <label>Date of Birth</label>

                <input type="date"
                       id="dob"
                       class="form-control">

            </div>



            <!-- GENDER -->

            <div class="mb-3">

                <label>Gender</label>

                <div class="gender-box">

                    <label>

                        <input type="radio"
                               name="gender"
                               value="Male">

                        Male

                    </label>


                    <label>

                        <input type="radio"
                               name="gender"
                               value="Female">

                        Female

                    </label>


                    <label>

                        <input type="radio"
                               name="gender"
                               value="Other">

                        Other

                    </label>

                </div>

            </div>



            <!-- CONTACT & ACADEMIC -->

            <div class="section-title">

                ✨ Contact & Academic Details

            </div>



            <!-- EMAIL -->

            <div class="mb-3">

                <label>Email Address</label>

                <input type="email"
                       id="email"
                       class="form-control"
                       placeholder="example@email.com">

            </div>



            <!-- PHONE -->

            <div class="mb-3">

                <label>Phone Number</label>

                <input type="tel"
                       id="phone"
                       class="form-control"
                       placeholder="Enter phone number">

            </div>



            <!-- COURSE -->

            <div class="mb-3">

                <label>Course</label>

                <select id="course"
                        class="form-select">

                    <option value="">
                        Select your course
                    </option>

                    <option value="CSE">
                        Computer Science Engineering
                    </option>

                    <option value="ECE">
                        Electronics and Communication Engineering
                    </option>

                    <option value="EEE">
                        Electrical and Electronics Engineering
                    </option>

                    <option value="MECH">
                        Mechanical Engineering
                    </option>

                    <option value="CIVIL">
                        Civil Engineering
                    </option>

                </select>

            </div>



            <!-- ADDRESS -->

            <div class="mb-3">

                <label>Address</label>

                <textarea id="address"
                          class="form-control"
                          rows="3"
                          placeholder="Enter your address"></textarea>

            </div>



            <!-- PASSWORD -->

            <div class="row">


                <div class="col-md-6 mb-3">

                    <label>Password</label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Enter password">

                </div>


                <div class="col-md-6 mb-3">

                    <label>Confirm Password</label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm password">

                </div>


            </div>



            <!-- BUTTONS -->

            <div class="button-area">


                <button type="submit"
                        class="btn register-btn">

                    ♡ Register ♡

                </button>


                <button type="reset"
                        class="btn clear-btn">

                    Clear Form

                </button>


            </div>


        </form>



        <!-- MESSAGE -->

        <div id="message"></div>



        <!-- REGISTERED STUDENTS -->

        <div class="student-section">


            <div class="student-title">

                ♡ Registered Students ♡

            </div>


            <div class="table-container">


                <table class="table table-bordered text-center">


                    <thead>

                        <tr>

                            <th>Student Name</th>

                            <th>Course</th>

                            <th>Phone Number</th>

                        </tr>

                    </thead>


                    <tbody id="studentTable">

                    </tbody>


                </table>


            </div>



            <!-- CLEAR DISPLAYED DATA -->

            <button type="button"
                    class="clear-data-btn"
                    onclick="clearStudentData()">

                🗑️ Clear Displayed Data

            </button>


        </div>


    </div>

</div>



<!-- JAVASCRIPT -->

<script>


document.getElementById("registrationForm")
.addEventListener("submit", function(event) {


    event.preventDefault();


    /* Get form values */

    let firstName =
        document.getElementById("firstName").value.trim();


    let lastName =
        document.getElementById("lastName").value.trim();


    let email =
        document.getElementById("email").value.trim();


    let phone =
        document.getElementById("phone").value.trim();


    let dob =
        document.getElementById("dob").value;


    let course =
        document.getElementById("course").value;


    let password =
        document.getElementById("password").value;


    let confirmPassword =
        document.getElementById("confirmPassword").value;



    /* Check empty fields */

    if (firstName == "" ||
        lastName == "" ||
        email == "" ||
        phone == "" ||
        dob == "" ||
        course == "" ||
        password == "" ||
        confirmPassword == "") {


        alert("Please fill all the required fields! 💜");

        return;

    }



    /* Check password */

    if (password != confirmPassword) {

        alert("Passwords do not match! 💜");

        return;

    }



    /* Create student name */

    let studentName =
        firstName + " " + lastName;



    /* Get table */

    let table =
        document.getElementById("studentTable");



    /* Create new row */

    let newRow =
        table.insertRow();



    /* Create cells */

    let nameCell =
        newRow.insertCell(0);


    let courseCell =
        newRow.insertCell(1);


    let phoneCell =
        newRow.insertCell(2);



    /* Add values */

    nameCell.innerHTML =
        studentName;


    courseCell.innerHTML =
        course;


    phoneCell.innerHTML =
        phone;



    /* Success message */

    document.getElementById("message").innerHTML =

        "<div class='alert alert-success mt-4'>" +

        "💜✨ Student registered successfully! ✨💜" +

        "</div>";



    /* Clear form */

    document.getElementById("registrationForm").reset();

});



/* Clear displayed students */

function clearStudentData() {


    document.getElementById("studentTable").innerHTML = "";


    document.getElementById("message").innerHTML =

        "<div class='alert alert-info mt-4'>" +

        "♡ All displayed student data has been cleared ♡" +

        "</div>";

}


</script>


</body>

</html>
